# jarvis-engine (helper 0.5.9): the bot's OS sandbox off, as in the unit of new installs (owner rights, 09.10):
# with NoNewPrivileges sudo is dead for the bot and its agent. Counts from the bot's next restart; the helper
# never restarts the bot. /etc/jarvis-engine/full-rights-off = the helper removes this file.
[Service]
NoNewPrivileges=false
ProtectSystem=false
ProtectHome=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectControlGroups=false
RestrictSUIDSGID=false
ReadWritePaths=
