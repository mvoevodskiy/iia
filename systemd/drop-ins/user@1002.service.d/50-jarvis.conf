# /etc/systemd/system/user@1002.service.d/50-jarvis.conf (openclaw-install.sh)
# The user manager of `openclaw` and everything it starts (the gateway, its agent runs):
#   ProtectProc=invisible  other users' processes are invisible in /proc (the bot passes persona and
#                          memory in argv; /proc has no hidepid on the base image)
#   PrivateTmp=yes         no shared /tmp with Jarvis (upstream logs to /tmp/openclaw by default)
#   OOMScoreAdjust=700     under host memory pressure OpenClaw goes before the bot (-500); children inherit
#   Requires/After the nft oneshot: when the loopback guard did not load, the user manager (and the gateway with
#                          its unauthenticated CDP ports) does not start either
[Unit]
Requires=jarvis-engine-nft.service
After=jarvis-engine-nft.service

[Service]
ProtectProc=invisible
PrivateTmp=yes
OOMScoreAdjust=700
